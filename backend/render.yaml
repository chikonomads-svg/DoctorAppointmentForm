services:
  - type: web
    name: dr-deepak-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/build_medicine_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        sync: false        # set this manually in Render dashboard (PostgreSQL connection string)
      - key: OPENAI_API_KEY
        sync: false        # optional — for camera OCR feature
      - key: JWT_SECRET
        sync: false        # optional — for JWT token signing
